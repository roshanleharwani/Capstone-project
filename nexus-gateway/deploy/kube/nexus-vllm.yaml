apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-llamacpp
  namespace: nexus-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-llamacpp
  template:
    metadata:
      labels:
        app: nexus-llamacpp
    spec:
      nodeSelector:
        node.kubernetes.io/instance-type: c7g.2xlarge
      volumes:
        - name: model-volume
          emptyDir: {}
      initContainers:
        - name: download-model
          image: busybox
          command:
            - "sh"
            - "-c"
            - "wget -O /models/model.gguf https://huggingface.co/lmstudio-community/Meta-Llama-3-8B-Instruct-GGUF/resolve/main/Meta-Llama-3-8B-Instruct-Q4_K_M.gguf"
          volumeMounts:
            - name: model-volume
              mountPath: /models
      containers:
        - name: llamacpp
          image: ghcr.io/ggerganov/llama.cpp:server
          args:
            - "-m"
            - "/models/model.gguf"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "-c"
            - "4096"
            - "-t"
            - "8"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: model-volume
              mountPath: /models
          resources:
            requests:
              cpu: "6"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "14Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-vllm # Kept name as nexus-vllm so Spring Boot connects seamlessly!
  namespace: nexus-gateway
spec:
  selector:
    app: nexus-llamacpp
  ports:
    - port: 8000
      targetPort: 8000
