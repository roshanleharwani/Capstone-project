# Tier-3 self-hosted LLM (vLLM OpenAI-compatible API) on AWS GPU nodes.
# Requires: gpu-llm-node-group scaled > 0 + nvidia-device-plugin DaemonSet.
# Service name stays nexus-vllm so Spring Boot / VllmConnector keep working.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-vllm-hf
  namespace: nexus-gateway
type: Opaque
stringData:
  # Optional — required only for gated Hugging Face models. Leave empty for public weights.
  HF_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-vllm
  namespace: nexus-gateway
  labels:
    app: nexus-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-vllm
  template:
    metadata:
      labels:
        app: nexus-vllm
        workload: llm
    spec:
      nodeSelector:
        workload: llm
        node.kubernetes.io/instance-type: g4dn.xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.6.post1
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "meta-llama/Meta-Llama-3-8B-Instruct"
            - "--dtype"
            - "half"
            - "--max-model-len"
            - "4096"
            - "--gpu-memory-utilization"
            - "0.90"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
            - "--served-model-name"
            - "llama3-8b-instruct"
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexus-vllm-hf
                  key: HF_TOKEN
                  optional: true
            - name: HF_HOME
              value: /root/.cache/huggingface
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: "3"
              memory: "12Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: "14Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: hf-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: hf-cache
          emptyDir:
            sizeLimit: 40Gi
---
# Backward-compatible alias Deployment name used by older docs (llama.cpp path).
# Kept as a zero-replica stub so kubectl apply -f deploy/kube/ stays clean.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-llamacpp
  namespace: nexus-gateway
  labels:
    app: nexus-llamacpp
spec:
  replicas: 0
  selector:
    matchLabels:
      app: nexus-llamacpp
  template:
    metadata:
      labels:
        app: nexus-llamacpp
    spec:
      containers:
        - name: placeholder
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-vllm
  namespace: nexus-gateway
  labels:
    app: nexus-vllm
spec:
  selector:
    app: nexus-vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
