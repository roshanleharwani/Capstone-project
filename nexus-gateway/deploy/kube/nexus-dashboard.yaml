apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-dashboard
  namespace: nexus-gateway
  labels:
    app: nexus-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-dashboard
  template:
    metadata:
      labels:
        app: nexus-dashboard
    spec:
      containers:
      - name: dashboard
        image: 611597330624.dkr.ecr.ap-south-1.amazonaws.com/nexus-gateway-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_PROXY_URL
          value: "http://nexus-proxy.nexus-gateway.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-dashboard
  namespace: nexus-gateway
spec:
  selector:
    app: nexus-dashboard
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
