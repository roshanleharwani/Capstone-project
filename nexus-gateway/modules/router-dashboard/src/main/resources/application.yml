server:
  port: 8084 # Port for the Router module

spring:
  application:
    name: router-dashboard
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# AWS Bedrock — Tier 1 inference (replaces self-hosted vLLM)
nexus:
  bedrock:
    region: ap-south-1
    model-id: meta.llama3-8b-instruct-v1:0

# OpenAI — Tier 2 inference (set OPENAI_API_KEY in the environment or a local .env)
openai:
  api:
    key: ${OPENAI_API_KEY:}
