# =============================================================================
# NexusMarket Incentive Engine — Application Configuration
# =============================================================================

spring.application.name=market-incentives
server.port=8083

# -----------------------------------------------------------------------------
# PostgreSQL — Quota tables and immutable ledger
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/nexusgateway
spring.datasource.username=nexus
spring.datasource.password=nexus_secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -----------------------------------------------------------------------------
# Valkey / Redis — Credit ledger balance cache
# Valkey is a Redis-compatible drop-in; Spring Data Redis works without changes.
# -----------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# TTL for cached tenant balance (seconds) — short TTL keeps cache consistent
market.ledger.balance-cache-ttl-seconds=30

# -----------------------------------------------------------------------------
# Stackelberg Dynamic Pricing Parameters
# p_t = p_min + (p_max - p_min) * sigmoid(k * (U - threshold))
# -----------------------------------------------------------------------------
market.pricing.p-min=0.5
market.pricing.p-max=3.0
market.pricing.steepness=12.0
market.pricing.utilization-threshold=0.75

# -----------------------------------------------------------------------------
# VCG Auction Parameters
# -----------------------------------------------------------------------------
# Minimum bid accepted by the auction (credits per 1000 tokens)
market.auction.min-bid=0.1

# -----------------------------------------------------------------------------
# Quota Parameters
# -----------------------------------------------------------------------------
# Default daily token limit for a new tenant (can be overridden per-tenant in DB)
market.quota.default-daily-limit=1000000
