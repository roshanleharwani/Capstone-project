server.port=8082
spring.application.name=context-compression

# PostgreSQL / pgvector (production)
spring.datasource.url=jdbc:postgresql://localhost:5432/nexusgateway
spring.datasource.username=nexus
spring.datasource.password=nexus_secret
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Compression settings
compression.target-ratio=0.5
